name: Snapshot

on:
  schedule:
    # UTC. GitHub may delay or drop scheduled runs under load, especially at :00.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch snapshot
        run: node scripts/snapshot.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add data/snapshot.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update market snapshot"
            git push
          fi